    />

    <rect
      x="182"
      y="96"
      width="6"
      height="6"
      fill="#1a1a1a"
    />

    <rect
      x="170"
      y="102"
      width="12"
      height="6"
      fill="#1a1a1a"
    />


    <!-- ==================== NECK ==================== -->

    <rect
      x="160"
      y="116"
      width="32"
      height="8"
      fill="#3a7a3a"
    />


    <!-- ==================== BODY ==================== -->

    <g id="creeper-body">

      <rect
        x="148"
        y="124"
        width="56"
        height="44"
