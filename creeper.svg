        fill="#3a8a3a"
      />

      <rect
        x="196"
        y="60"
        width="8"
        height="8"
        fill="#3a8a3a"
      />

      <rect
        x="148"
        y="108"
        width="8"
        height="8"
        fill="#3a8a3a"
      />

      <rect
        x="196"
        y="108"
        width="8"
        height="8"
        fill="#3a8a3a"
      />

      <rect
        x="156"
        y="68"
        width="8"
        height="8"
        fill="#5aaa5a"
      />

      <rect
        x="188"
        y="68"
        width="8"
        height="8"
