<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 200"
     width="400"
     height="200">

  <style>

    /* =====================================================
       MAIN CREEPER ANIMATION
       Complete sequence repeats every 5 seconds
       ===================================================== */

    #creeper {
      animation: walk 5s ease-in-out infinite;
    }

    @keyframes walk {

      /* Start outside the screen */
      0% {
        transform: translateX(-120px);
        opacity: 1;
      }

      /* Walk into the scene */
      40% {
        transform: translateX(0);
        opacity: 1;
      }

      /* Stay visible */
      82% {
        transform: translateX(0);
        opacity: 1;
      }

      /* Disappear during explosion */
      86% {
        transform: translateX(0);
        opacity: 0;
      }

      /* Return to starting position */
      100% {
        transform: translateX(-120px);
        opacity: 0;
      }
    }


    /* =====================================================
       WALKING LEGS
       ===================================================== */

    #leg-left {
      transform-origin: 162px 168px;
      animation: legL 0.3s ease-in-out infinite alternate;
    }

    #leg-right {
      transform-origin: 190px 168px;
      animation: legR 0.3s ease-in-out 0.15s infinite alternate;
    }

    @keyframes legL {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(18deg);
      }

    }

    @keyframes legR {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-18deg);
      }

    }


    /* =====================================================
       BLINK
       ===================================================== */

    #eye-left,
    #eye-right {
      animation: blink 5s linear infinite;
    }

    @keyframes blink {

      /* Normal eyes */
      0%,
      48%,
      52%,
      100% {
        fill: #1a1a1a;
      }

      /* Blink */
      49%,
      51% {
        fill: #ffffff;
      }

    }


    /* =====================================================
       CHARGING FLASH
       ===================================================== */

    #creeper-head {
      animation: headFlash 5s linear infinite;
    }

    #creeper-body {
      animation: bodyFlash 5s linear infinite;
    }

    @keyframes headFlash {

      /* Normal */
      0%,
      75% {
        fill: #4a9a4a;
      }

      /* Flash */
      77%,
      79% {
        fill: #ffffff;
      }

      /* Return to normal */
      81%,
      100% {
        fill: #4a9a4a;
      }

    }

    @keyframes bodyFlash {

      /* Normal */
      0%,
      75% {
        fill: #3a7a3a;
      }

      /* Flash */
      77%,
      79% {
        fill: #ffffff;
      }

      /* Return to normal */
      81%,
      100% {
        fill: #3a7a3a;
      }

    }


    /* =====================================================
       SSSSSSS TEXT
       ===================================================== */

    #ssss-text {
      opacity: 0;

      animation: ssss 5s linear infinite;

      font-family: "Courier New", monospace;
      font-weight: bold;
      font-size: 18px;
      fill: #88ff88;
    }

    @keyframes ssss {

      /* Hidden */
      0%,
      55% {
        opacity: 0;
      }

      /* Appears */
      57%,
      78% {
        opacity: 1;
      }

      /* Disappears */
      82%,
      100% {
        opacity: 0;
      }

    }


    /* =====================================================
       EXPLOSION
       ===================================================== */

    #explosion {

      opacity: 0;

      transform-box: fill-box;
      transform-origin: center;

      animation: explode 5s linear infinite;
    }

    @keyframes explode {

      /* Hidden before explosion */
      0%,
      84% {
        opacity: 0;
        transform: scale(0.15);
      }

      /* Explosion starts */
      86% {
        opacity: 1;
        transform: scale(1.35);
      }

      /* Explosion expands */
      90% {
        opacity: 1;
        transform: scale(1.05);
      }

      /* Explosion disappears */
      100% {
        opacity: 0;
        transform: scale(1.5);
      }

    }


    /* =====================================================
       BOOM TEXT
       ===================================================== */

    #boom-text {

      opacity: 0;

      animation: boom 5s linear infinite;

      transform-box: fill-box;
      transform-origin: center;

      font-family: "Courier New", monospace;
      font-weight: bold;
      font-size: 28px;
      fill: #ff4444;
    }

    @keyframes boom {

      /* Hidden */
      0%,
      86% {
        opacity: 0;
        transform: scale(0.5);
      }

      /* Appears */
      88% {
        opacity: 1;
        transform: scale(1.3);
      }

      /* Stays visible */
      93% {
        opacity: 1;
        transform: scale(1);
      }

      /* Disappears */
      100% {
        opacity: 0;
        transform: scale(0.8) translateY(-20px);
      }

    }

  </style>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect
    width="400"
    height="200"
    rx="12"
    fill="#0d1117"
  />


  <!-- =====================================================
       GROUND
       ===================================================== -->

  <rect
    x="0"
    y="168"
    width="400"
    height="4"
    fill="#1a2a1a"
  />


  <!-- =====================================================
