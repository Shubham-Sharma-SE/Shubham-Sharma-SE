      />

      <rect
        x="172"
        y="136"
        width="8"
        height="8"
        fill="#4a8a4a"
      />

      <rect
        x="156"
        y="152"
        width="8"
        height="8"
        fill="#2a6a2a"
      />

      <rect
        x="188"
        y="152"
        width="8"
        height="8"
        fill="#4a8a4a"
      />

    </g>


    <!-- ==================== LEFT LEG ==================== -->

    <g id="leg-left">

      <rect
        x="152"
        y="168"
        width="20"
        height="20"
        fill="#3a7a3a"
      />

    </g>


    <!-- ==================== RIGHT LEG ==================== -->

    <g id="leg-right">

      <rect
        x="180"
        y="168"
        width="20"
        height="20"
        fill="#3a7a3a"
      />

    </g>

  </g>


  <!-- =====================================================
       CHARGING SOUND
       ===================================================== -->

  <text
    id="ssss-text"
    x="176"
    y="50"
    text-anchor="middle"
  >
    SSSSSS...
  </text>


  <!-- =====================================================
       EXPLOSION
       ===================================================== -->

  <g id="explosion">

    <!-- Main explosion -->

    <circle
      cx="176"
      cy="120"
      r="45"
      fill="#ff8800"
    />

    <circle
      cx="176"
      cy="120"
      r="32"
      fill="#ffcc00"
    />

    <circle
