    />

    <polygon
      points="230,165 210,145 225,140"
      fill="#ffaa00"
    />

    <polygon
      points="122,165 142,145 127,140"
      fill="#ff6600"
    />

  </g>


  <!-- =====================================================
       BOOM
       ===================================================== -->

  <text
    id="boom-text"
    x="176"
    y="130"
    text-anchor="middle"
  >
    BOOM!
  </text>


</svg>
