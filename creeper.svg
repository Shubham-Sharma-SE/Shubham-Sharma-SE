<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    /* Creeper walks into the scene, then disappears after the explosion */
    #creeper {
      animation:
        walk 2s ease-out forwards,
        hide 0.1s ease-in 4.3s forwards;
    }

    @keyframes walk {
      0%   { transform: translateX(-120px); }
      100% { transform: translateX(0); }
    }

    /* Walking legs */
    #leg-left {
      transform-origin: 162px 168px;
      animation: legL 0.3s ease-in-out 0s 7 alternate;
    }

    #leg-right {
      transform-origin: 190px 168px;
      animation: legR 0.3s ease-in-out 0s 7 alternate;
    }

    @keyframes legL {
      from { transform: rotate(0deg); }
      to   { transform: rotate(18deg); }
    }

    @keyframes legR {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-18deg); }
    }

    /* Blink */
    #eye-left,
    #eye-right {
      animation: blink 0.15s ease-in-out 2.5s 4 alternate;
    }

    @keyframes blink {
      0%, 100% { fill: #1a1a1a; }
      50%       { fill: #ffffff; }
    }

    /* Charging flash */
    #creeper-head {
      animation: headFlash 0.15s ease-in-out 3.8s 3 alternate;
    }

    #creeper-body {
      animation: bodyFlash 0.15s ease-in-out 3.8s 3 alternate;
    }

    @keyframes headFlash {
      0%   { fill: #4a9a4a; }
      100% { fill: #ffffff; }
    }

    @keyframes bodyFlash {
      0%   { fill: #3a7a3a; }
      100% { fill: #ffffff; }
    }

    /* Hide creeper at explosion */
    @keyframes hide {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Explosion */
    #explosion {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: explode 0.8s ease-out 4.3s forwards;
    }

    @keyframes explode {
      0% {
        opacity: 0;
        transform: scale(0.15);
      }

      20% {
        opacity: 1;
        transform: scale(1.35);
      }

      60% {
        opacity: 1;
        transform: scale(1.05);
      }

      100% {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    /* SSSSS text */
    #ssss-text {
      opacity: 0;
      animation: ssss 1.5s ease-in 2.8s forwards;
      font-family: "Courier New", monospace;
      font-weight: bold;
      font-size: 18px;
      fill: #88ff88;
    }

    @keyframes ssss {
      0%      { opacity: 0; }
      20%, 80% { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* BOOM text */
    #boom-text {
      opacity: 0;
      animation: boom 1s ease-out 4.35s forwards;
      transform-box: fill-box;
      transform-origin: center;
      font-family: "Courier New", monospace;
      font-weight: bold;
      font-size: 28px;
      fill: #ff4444;
    }

    @keyframes boom {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      30% {
        opacity: 1;
        transform: scale(1.3);
      }

      70% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(0.8) translateY(-20px);
      }
    }
  </style>

  <!-- Background -->
  <rect width="400" height="200" rx="12" fill="#0d1117"/>

  <!-- Ground -->
  <rect x="0" y="168" width="400" height="4" fill="#1a2a1a"/>

  <!-- CREEPER -->
  <g id="creeper">

    <!-- Head -->
    <g id="creeper-head">
      <rect x="148" y="60" width="56" height="56" rx="2" fill="#4a9a4a"/>

      <!-- Pixel texture -->
      <rect x="148" y="60" width="8" height="8" fill="#3a8a3a"/>
      <rect x="196" y="60" width="8" height="8" fill="#3a8a3a"/>
      <rect x="148" y="108" width="8" height="8" fill="#3a8a3a"/>
      <rect x="196" y="108" width="8" height="8" fill="#3a8a3a"/>
      <rect x="156" y="68" width="8" height="8" fill="#5aaa5a"/>
      <rect x="188" y="68" width="8" height="8" fill="#5aaa5a"/>
      <rect x="172" y="60" width="8" height="8" fill="#5aaa5a"/>
    </g>

    <!-- Eyes -->
    <rect id="eye-left"
          x="156" y="76"
          width="14" height="14"
          fill="#1a1a1a"/>

    <rect id="eye-right"
          x="182" y="76"
          width="14" height="14"
          fill="#1a1a1a"/>

    <!-- Mouth -->
    <rect x="164" y="96" width="6" height="6" fill="#1a1a1a"/>
    <rect x="182" y="96" width="6" height="6" fill="#1a1a1a"/>
    <rect x="170" y="102" width="12" height="6" fill="#1a1a1a"/>

    <!-- Neck -->
    <rect x="160" y="116" width="32" height="8" fill="#3a7a3a"/>

    <!-- Body -->
    <g id="creeper-body">
      <rect x="148" y="124" width="56" height="44" rx="2" fill="#3a7a3a"/>

      <!-- Body texture -->
      <rect x="156" y="128" width="8" height="8" fill="#4a8a4a"/>
      <rect x="188" y="128" width="8" height="8" fill="#2a6a2a"/>
      <rect x="172" y="136" width="8" height="8" fill="#4a8a4a"/>
      <rect x="156" y="152" width="8" height="8" fill="#2a6a2a"/>
      <rect x="188" y="152" width="8" height="8" fill="#4a8a4a"/>
    </g>

    <!-- Left leg -->
    <g id="leg-left">
      <rect x="152" y="168" width="20" height="20" fill="#3a7a3a"/>
    </g>

    <!-- Right leg -->
    <g id="leg-right">
      <rect x="180" y="168" width="20" height="20" fill="#3a7a3a"/>
    </g>

  </g>

  <!-- Charging sound -->
  <text id="ssss-text"
        x="176"
        y="50"
        text-anchor="middle">
    SSSSSS...
  </text>

  <!-- Explosion -->
  <g id="explosion">

    <circle cx="176" cy="120" r="45" fill="#ff8800"/>
    <circle cx="176" cy="120" r="32" fill="#ffcc00"/>
    <circle cx="176" cy="120" r="18" fill="#ffffff"/>

    <!-- Explosion shards -->
    <polygon points="176,60 185,85 167,85" fill="#ff4400"/>
    <polygon points="230,100 205,115 210,95" fill="#ff6600"/>
    <polygon points="122,100 147,115 142,95" fill="#ff4400"/>
    <polygon points="176,180 185,155 167,155" fill="#ff6600"/>
    <polygon points="220,60 205,85 220,90" fill="#ffaa00"/>
    <polygon points="132,60 147,85 132,90" fill="#ff4400"/>
    <polygon points="230,165 210,145 225,140" fill="#ffaa00"/>
    <polygon points="122,165 142,145 127,140" fill="#ff6600"/>

  </g>

  <!-- BOOM -->
  <text id="boom-text"
        x="176"
        y="130"
        text-anchor="middle">
    BOOM!
  </text>

</svg>
